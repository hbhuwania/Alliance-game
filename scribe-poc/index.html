<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Ambient Scribe POC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <main class="max-w-xl mx-auto px-4 py-6 space-y-5">
    <header class="text-center">
      <h1 class="text-2xl font-bold">🇮🇳 Ambient Scribe POC</h1>
      <p class="text-sm text-slate-500 mt-1">Record an OPD consultation and get a structured SOAP note.</p>
    </header>

    <section class="bg-white rounded-2xl shadow p-5 space-y-4">
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide" for="apiUrl">Backend URL</label>
      <input id="apiUrl" type="url" value="http://127.0.0.1:8000/process-audio"
             class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />

      <button id="recordBtn"
              class="w-full py-5 rounded-2xl bg-emerald-600 active:bg-emerald-700 text-white text-xl font-semibold shadow-lg disabled:opacity-50">
        🎙️ Record Visit
      </button>
      <button id="stopBtn"
              class="hidden w-full py-5 rounded-2xl bg-red-600 active:bg-red-700 text-white text-xl font-semibold shadow-lg">
        ⏹️ Stop &amp; Process
      </button>

      <div class="flex items-center justify-center gap-2 text-sm">
        <span id="statusDot" class="inline-block w-3 h-3 rounded-full bg-slate-300"></span>
        <span id="status" class="text-slate-600">Idle</span>
        <span id="timer" class="font-mono text-slate-500"></span>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow p-5">
      <h2 class="text-lg font-semibold mb-2">Raw Transcript</h2>
      <div id="transcript" class="min-h-[5rem] whitespace-pre-wrap text-sm text-slate-700 bg-slate-50 rounded-lg p-3 border border-slate-200">
        Tap "Record Visit" to begin.
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow p-5">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-semibold">Structured Output</h2>
        <button id="copyBtn" disabled
                class="px-4 py-2 rounded-lg bg-slate-800 active:bg-slate-900 text-white text-sm font-medium disabled:opacity-40">
          📋 Copy JSON
        </button>
      </div>
      <pre id="output" class="text-xs bg-slate-900 text-emerald-300 rounded-lg p-3 overflow-x-auto max-h-[60vh] whitespace-pre">{}</pre>
    </section>
  </main>

  <script>
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const copyBtn = document.getElementById('copyBtn');
    const statusEl = document.getElementById('status');
    const statusDot = document.getElementById('statusDot');
    const timerEl = document.getElementById('timer');
    const transcriptEl = document.getElementById('transcript');
    const outputEl = document.getElementById('output');
    const apiUrlEl = document.getElementById('apiUrl');

    let mediaRecorder = null;
    let mediaStream = null;
    let chunks = [];
    let mimeType = '';
    let timerId = null;
    let startedAt = 0;
    let lastJson = null;

    function setStatus(text, color) {
      statusEl.textContent = text;
      statusDot.className = 'inline-block w-3 h-3 rounded-full ' + color;
    }

    function pickMimeType() {
      const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
      if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
      return candidates.find(t => MediaRecorder.isTypeSupported(t)) || '';
    }

    function startTimer() {
      startedAt = Date.now();
      timerEl.textContent = '00:00';
      timerId = setInterval(() => {
        const s = Math.floor((Date.now() - startedAt) / 1000);
        timerEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      }, 500);
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function stopStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
    }

    recordBtn.addEventListener('click', async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Microphone API not available (use localhost/HTTPS)', 'bg-red-500');
        return;
      }
      try {
        setStatus('Requesting microphone…', 'bg-amber-400');
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
        });
      } catch (err) {
        setStatus('Microphone permission denied', 'bg-red-500');
        transcriptEl.textContent = 'Error: ' + err.message;
        return;
      }

      chunks = [];
      mimeType = pickMimeType();
      mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
      mimeType = mediaRecorder.mimeType || mimeType || 'audio/webm';

      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = processRecording;
      mediaRecorder.start(1000);

      startTimer();
      setStatus('Recording…', 'bg-red-500 animate-pulse');
      transcriptEl.textContent = 'Listening to the consultation…';
      outputEl.textContent = '{}';
      copyBtn.disabled = true;
      lastJson = null;
      recordBtn.classList.add('hidden');
      stopBtn.classList.remove('hidden');
    });

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      stopTimer();
      stopStream();
      stopBtn.classList.add('hidden');
      recordBtn.classList.remove('hidden');
      recordBtn.disabled = true;
    });

    async function processRecording() {
      const blob = new Blob(chunks, { type: mimeType });
      const ext = mimeType.includes('mp4') ? 'mp4' : (mimeType.includes('ogg') ? 'ogg' : 'webm');
      const formData = new FormData();
      formData.append('file', blob, 'visit.' + ext);

      setStatus('Transcribing & structuring…', 'bg-sky-500 animate-pulse');
      transcriptEl.textContent = 'Uploading ' + (blob.size / 1024).toFixed(1) + ' KB of audio…';

      try {
        const res = await fetch(apiUrlEl.value.trim(), { method: 'POST', body: formData });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));

        transcriptEl.textContent = data.transcript || '(empty transcript)';
        lastJson = data.clinical_json || {};
        outputEl.textContent = JSON.stringify(lastJson, null, 2);
        copyBtn.disabled = false;
        setStatus('Done', 'bg-emerald-500');
      } catch (err) {
        transcriptEl.textContent = 'Error: ' + err.message;
        setStatus('Failed', 'bg-red-500');
      } finally {
        recordBtn.disabled = false;
      }
    }

    copyBtn.addEventListener('click', async () => {
      if (!lastJson) return;
      const text = JSON.stringify(lastJson, null, 2);
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      const original = copyBtn.textContent;
      copyBtn.textContent = '✅ Copied';
      setTimeout(() => { copyBtn.textContent = original; }, 1500);
    });
  </script>
</body>
</html>
